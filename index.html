<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مدينة البطل | Hero City</title>
    <meta name="description" content="A bright, cute low-poly 3D kids' city game built with Vanilla JavaScript and Three.js." />
    <meta property="og:title" content="مدينة البطل | Hero City" />
    <meta property="og:description" content="A bright, cute low-poly 3D kids' city game built with Vanilla JavaScript and Three.js." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <canvas id="game-canvas"></canvas>

    <div class="top-controls">
      <button id="mute-btn" class="top-pill-btn" type="button" aria-label="Mute or unmute">🔊</button>
      <button id="lang-btn" class="top-pill-btn lang-btn" type="button">ع / EN</button>
    </div>

    <div id="star-bar" class="star-bar hidden" aria-label="Progress"></div>

    <div id="mission-banner" class="mission-banner hidden"></div>

    <div id="menu-overlay" class="overlay">
      <div class="menu-panel">
        <h1 id="menu-title" class="menu-title"></h1>
        <p id="menu-prompt" class="menu-prompt"></p>
        <div class="hero-cards">
          <button class="hero-card hero-card--boy" data-hero="boy" type="button">
            <div class="hero-art"><img id="img-boy" alt="Boy hero" class="hero-img" /></div>
            <span id="label-boy" class="hero-label"></span>
          </button>
          <button class="hero-card hero-card--girl" data-hero="girl" type="button">
            <div class="hero-art"><img id="img-girl" alt="Girl hero" class="hero-img" /></div>
            <span id="label-girl" class="hero-label"></span>
          </button>
        </div>
        <button id="continue-btn" class="action-btn continue-btn hidden" type="button"></button>
      </div>
    </div>

    <div id="mission-top" class="mission-top hidden">
      <div class="mission-row">
        <span id="mission-emoji" class="mission-emoji"></span>
        <h2 id="mission-title" class="mission-title"></h2>
        <button id="speak-btn" class="speak-btn" type="button" aria-label="Speak">🔈</button>
      </div>
      <p id="why-line" class="why-line hidden"></p>
    </div>

    <div id="cards-row" class="cards-row hidden"></div>

    <div id="lesson-bar" class="lesson-bar hidden">
      <p id="lesson-text" class="lesson-text"></p>
      <button id="next-btn" class="action-btn next-btn" type="button"></button>
    </div>

    <div id="final-overlay" class="overlay hidden">
      <div class="menu-panel final-panel">
        <div id="final-score" class="final-score"></div>
        <h2 id="final-title" class="menu-title"></h2>
        <button id="restart-btn" class="action-btn" type="button"></button>
      </div>
    </div>

    <div id="webgl-error" class="webgl-error hidden"><p id="webgl-error-text"></p></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
